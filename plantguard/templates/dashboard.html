<!DOCTYPE html>

<head>

  <title>Live Camera — PlantGuard AI</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">PlantGuard AI</a>
    <div class="nav-links">
